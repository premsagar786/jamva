spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

secureid:
  jwt:
    secret: test-secret-must-be-at-least-32-characters-long-for-hs256
    expiration: 900000
    refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000
