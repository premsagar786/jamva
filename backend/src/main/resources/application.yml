server:
  port: 8080

spring:
  application:
    name: secureid
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/secureid}
    username: ${DATABASE_USERNAME:secureid}
    password: ${DATABASE_PASSWORD:secureid}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            issuer-uri: https://accounts.google.com

secureid:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars-long-secure}
    expiration: ${JWT_EXPIRATION:900000}  # 15 minutes in ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in ms
    issuer: secureid
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
  rate-limit:
    login: 5
    register: 3
    forgot-password: 3
    reset-password: 5
    refresh: 10
    window-seconds: 60
  lockout:
    max-attempts: 5
    lock-duration-minutes: 15
    fail-window-minutes: 15
  password:
    min-length: 8
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special: true
  email:
    verification-expiry-minutes: 30
    reset-expiry-minutes: 15
    from: ${MAIL_FROM:no-reply@secureid.local}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  risk:
    thresholds:
      low: 30
      medium: 60
      high: 100
      critical: 101
    weights:
      new-device: 20
      new-location: 30
      failed-attempts: 20
      impossible-travel: 40
      unusual-time: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: secureid

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.secureid: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
